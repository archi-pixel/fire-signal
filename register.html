<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 QR 만들기 — 산불신호등</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e65100'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:980px}
#map{height:430px;border-radius:14px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
input[type=text],input[type=tel],select{font-size:17px;padding:10px 12px;border:1px solid #c9ccc6;border-radius:10px;min-width:0}
#name{flex:2;min-width:220px} #tel{flex:1;min-width:160px}
#out{display:none}
#sheet{background:#fff;border-radius:18px;padding:24px;margin-top:14px;text-align:center}
#sheet h2{font-size:30px;margin:0 0 4px}
#sheet .nm{font-size:24px;font-weight:800;margin:6px 0 14px}
#qr svg{width:260px;height:260px}
#sheet p{font-size:18px;margin:10px 0 0}
.info{font-size:17px;line-height:1.7;margin-top:12px}
@media (max-width:600px){#map{height:360px}}
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff} header,.no-print,#map,footer{display:none!important}
  main{max-width:none;padding:0} #out{display:block!important} #sheet{box-shadow:none;margin:20mm auto 0;padding:0}
  #qr svg{width:100mm;height:100mm} #sheet h2{font-size:36pt} #sheet .nm{font-size:24pt} #sheet p{font-size:16pt}
}
</style>
</head>
<body>
<main>
  <header><h1>현장 QR 만들기 · 감독자용</h1></header>
  <div class="row no-print">
    <button class="btn gray" data-go="nsc">자연과학캠퍼스</button>
    <button class="btn gray" data-go="hsc">인문사회과학캠퍼스</button>
    <button class="btn gray" id="gps">내 위치</button>
  </div>
  <div id="map" class="no-print"></div>
  <div class="no-print info" id="pick">지도에서 작업 위치를 누르세요. 초록색이 임상도상 숲입니다.</div>
  <div class="row no-print">
    <input type="text" id="name" maxlength="30" placeholder="현장 이름 (예: 제1공학관 옥상 방수)">
    <input type="tel" id="tel" maxlength="15" placeholder="감독자 연락처 (선택)">
  </div>
  <div class="row no-print">
    <select id="sg"></select>
    <select id="fsel" style="display:none">
      <option value="0">숲 바로 옆</option><option value="50">숲에서 100m 안</option><option value="300">숲과 멂</option>
    </select>
    <button class="btn" id="make">QR 만들기</button>
  </div>
  <section id="out">
    <div id="sheet">
      <h2>불티 작업 전 확인</h2>
      <div class="nm" id="snm"></div>
      <div id="qr"></div>
      <p id="stel" style="font-weight:700"></p>
      <p>휴대폰 카메라로 찍으면<br>오늘 이 현장의 산불위험과 할 일이 나옵니다.</p>
    </div>
    <div class="row no-print">
      <button class="btn" onclick="print()">인쇄</button>
      <a class="btn gray" id="open" target="_blank" rel="noopener">현장 화면 열어 보기</a>
      <input type="text" id="url" readonly style="flex:1;min-width:240px">
    </div>
  </section>
  <footer>숲 위치: 산림청 임상도(1:5,000, 2024) · 산불위험: 산림청 국립산림과학원 산불위험예보정보 · 배경지도 © OpenStreetMap</footer>
</main>
<script src="vendor/leaflet/leaflet.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="common.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const map = L.map('map').setView([CAMPUSES[0].lat, CAMPUSES[0].lng], 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

  let fire = null, forest = null, marker = null, pick = null;
  try { fire = await loadFire(); } catch (e) {}
  try { const r = await fetch('data/forest.geojson'); if (r.ok) forest = await r.json(); } catch (e) {}
  if (forest) L.geoJSON({ type: 'FeatureCollection', features: forest.features },
    { style: { color: '#2e7d32', weight: 1, fillColor: '#43a047', fillOpacity: .35 }, interactive: false }).addTo(map);

  const regions = fire ? Object.entries(fire.regions).sort((a, b) => a[1].name.localeCompare(b[1].name, 'ko')) : [];
  $('sg').innerHTML = '<option value="">지역 선택</option>' + regions.map(([c, r]) => `<option value="${c}">${esc(r.name)}</option>`).join('');

  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const c = CAMPUSES.find(x => x.id === b.dataset.go); map.setView([c.lat, c.lng], 16);
  });
  $('gps').onclick = () => {
    if (!navigator.geolocation) return alert('이 기기에서는 위치를 쓸 수 없습니다');
    navigator.geolocation.getCurrentPosition(
      p => { map.setView([p.coords.latitude, p.coords.longitude], 18); place(p.coords.latitude, p.coords.longitude); },
      () => alert('위치를 가져오지 못했습니다'), { enableHighAccuracy: true, timeout: 10000 });
  };

  function place(lat, lng) {
    if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng]).addTo(map);
    const dist = forest && (forest.districts || []).find(d => inGeometry(lat, lng, d.geometry));
    if (dist) $('sg').value = dist.properties.fire;            // 숲 자료를 받은 구 안이면 지역은 정해져 있음
    const ok = !!(forest && forest.coverage && inGeometry(lat, lng, forest.coverage));
    const fd = ok ? forestDistance(lat, lng, forest) : null;
    pick = { lat, lng, f: fd };
    $('fsel').style.display = ok ? 'none' : '';
    $('pick').innerHTML = ok
      ? `선택한 위치에서 숲까지 <b>${fd === 0 ? '0m (숲 안)' : '약 ' + fd + 'm'}</b> — ${fd <= NEAR_M ? '숲 옆 현장' : '숲과 먼 현장'}으로 안내합니다.`
      : '이 위치는 숲 자료 범위 밖입니다. 숲과의 거리와 지역을 직접 고르세요.';
  }
  map.on('click', e => place(e.latlng.lat, e.latlng.lng));

  $('make').onclick = () => {
    const n = $('name').value.trim(), sg = $('sg').value, t = $('tel').value.replace(/[^0-9+]/g, '');
    if (!pick) return alert('지도에서 작업 위치를 먼저 누르세요');
    if (!n) return alert('현장 이름을 적어 주세요');
    if (!sg) return alert('지역을 골라 주세요');
    const f = pick.f !== null ? pick.f : Number($('fsel').value);
    const u = new URL('./', location.href);
    u.searchParams.set('n', n); u.searchParams.set('sg', sg); u.searchParams.set('f', f);
    if (t) u.searchParams.set('t', t);
    const url = u.toString();
    try {
      const qr = qrcode(0, 'M'); qr.addData(url, 'Byte'); qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    } catch (e) { return alert('QR을 만들지 못했습니다. 현장 이름을 짧게 해 주세요.'); }
    $('snm').textContent = n; $('stel').textContent = t ? '감독자 연락처 ' + $('tel').value.trim() : ''; $('url').value = url; $('open').href = url;
    $('out').style.display = 'block'; $('out').scrollIntoView({ behavior: 'smooth' });
  };
})();
</script>
</body>
</html>
