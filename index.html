<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산불신호등 — 불티 작업 전 확인</title>
<meta name="description" content="산림청 산불위험예보와 임상도로 옥외 불티 작업(용접·절단·그라인더·예초기) 전 현장의 산불위험을 확인합니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e65100'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header><h1>산불신호등 · 불티 작업 전 확인</h1></header>
  <p class="where">불러오는 중…</p>
</main>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  let lang = pickLang(q);
  let fire = null, loadErr = false;
  try { fire = await loadFire(); } catch (e) { loadErr = true; }

  // 언어 바꾸기(작업자가 직접 고를 수 있게) — 고른 언어는 이 휴대폰에 기억
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (!b) return;
    lang = b.dataset.lang; saveLang(lang);
    const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u);
    render();
  });

  function langBar() {
    return `<nav class="langs" aria-label="Language">${LANGS.map(([c, n]) =>
      `<button type="button" data-lang="${c}"${c === lang ? ' aria-current="true"' : ''}>${n}</button>`).join('')}</nav>`;
  }
  function dotSize(s) { const n = [...s].length; return n > 9 ? 15 : n > 5 ? 18 : 24; }
  function dot(color, text) {
    return `<div class="dot" style="background:${color};font-size:${dotSize(text)}px">${esc(text)}</div>`;
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    const head = `<header><h1>${esc(t.title)}</h1></header>` + langBar();
    if (loadErr || !fire) { app.innerHTML = head + `<p class="err">${esc(t.loadErr)}</p>`; return; }
    const foot = `<footer>${esc(fmt(t.foot1, { src: fire.source }))}<br>${esc(fmt(t.foot2, { u: fire.updated }))}</footer>`;
    const koLine = s => lang === 'ko' ? '' : `<div class="todo-ko">${esc(s)}</div>`;

    // ── 현장 화면 (QR로 들어온 경우) ──
    if (q.has('sg')) {
      const sg = q.get('sg');
      const name = (q.get('n') || (lang === 'ko' ? '현장' : '')).slice(0, 40);
      const fRaw = q.get('f');
      const fNum = fRaw === null || fRaw === '' ? NaN : Number(fRaw);
      const fd = Number.isFinite(fNum) && fNum >= 0 ? Math.round(fNum) : null;   // 잘못된 값이면 '숲 옆'으로 보고 판단
      const tel = (q.get('t') || '').replace(/[^0-9+]/g, '').slice(0, 15);
      const region = hasRegion(fire, sg) ? fire.regions[sg] : null;
      const s = region && summarize(region, fire);
      document.title = `${name || t.title} — 산불신호등`;
      if (!s) {
        const u = lvText(UNKNOWN, lang);
        app.innerHTML = head + `<div class="site">${esc(name)}</div>
          <section class="card"><div class="lamp">${dot(UNKNOWN.color, u.name)}
          <div><div class="todo">${esc(u.todo)}</div>${koLine(UNKNOWN.todo)}</div></div></section>
          <p class="err">${esc(t.notFound)}</p>` + foot;
        return;
      }
      const near = fd === null || fd <= NEAR_M;
      const sig = s.stale ? UNKNOWN : !near ? FAR : levelOf(s.cur.max);
      const st = lvText(sig, lang);
      const lv = s.cur ? levelOf(s.cur.max) : null;
      const forestTxt = fd === null ? t.forestNone : fd === 0 ? t.forestIn : fmt(t.forestAbout, { d: fd });
      const days = s.days.map(d => `<div class="day"><span class="dl">${esc(dayLabelL(d.t, lang))}</span><div class="slots">${
        WORK_HOURS.map(h => {
          const x = d.slots.find(z => z.h === h);
          if (!x) return `<div class="slot" style="background:#d6d8d3;color:#777">${hourLabel(h, lang)}<small>-</small></div>`;
          const l = levelOf(x.max);
          return `<div class="slot" style="background:${near ? l.color : '#90a4ae'}">${hourLabel(h, lang)}<small>${esc(lvText(l, lang).name)}</small></div>`;
        }).join('')
      }</div></div>`).join('');
      app.innerHTML = head + `
        <div class="site">${esc(name)}</div>
        <div class="where">${esc(region.name)}</div>
        <section class="card">
          <div class="lamp">${dot(sig.color, st.name)}
            <div><div class="todo">${esc(st.todo)}</div>${koLine(sig.todo)}</div></div>
          <ul class="facts">
            <li>${esc(t.forest)} <b>${esc(forestTxt)}</b>${!near ? ' ' + esc(fmt(t.beyond, { m: NEAR_M })) : ''}</li>
            ${lv ? `<li>${esc(t.risk)} <b style="color:${lv.color}">${esc(lvText(lv, lang).name)}</b> · ${esc(t.index)} ${s.cur.max} <span class="muted">${esc(fmt(t.fcAt, { t: timeLabelL(s.cur.t, lang) }))}</span></li>` : ''}
          </ul>
          ${tel ? `<p style="margin:14px 0 0"><a class="btn" href="tel:${tel}">${esc(t.call)}</a></p>` : ''}
        </section>
        <section class="card"><p class="sub">${esc(t.slots)}</p><div class="days">${days || `<p>${esc(t.noFc)}</p>`}</div></section>
        ${s.stale ? `<p class="warn">${esc(s.dataOld ? fmt(t.staleOld, { u: fire.updated }) : t.staleNone)} ${esc(t.askSup)}</p>`
          : s.late ? `<p class="warn">${esc(fmt(t.late, { u: fire.updated }))}</p>` : ''}
      ` + foot;
      return;
    }

    // ── 첫 화면: 두 캠퍼스 ──
    document.title = '산불신호등 — 불티 작업 전 확인';
    const items = CAMPUSES.map(c => {
      const r = hasRegion(fire, c.sg) ? fire.regions[c.sg] : null; const s = r && summarize(r, fire);
      const lv = s && !s.stale ? levelOf(s.cur.max) : UNKNOWN;
      return `<a href="?sg=${c.sg}&n=${encodeURIComponent(c.n)}"><span>${esc(c.n)}<br><small class="muted" style="font-weight:400;font-size:15px">${esc(r ? r.name : '')}</small></span>
        <span class="pill" style="background:${lv.color}">${esc(lvText(lv, lang).name)}</span></a>`;
    }).join('');
    app.innerHTML = head + `
      <section class="card list">${items}</section>
      <p class="where" style="margin-top:14px">${esc(t.hint)}</p>
      <p><a class="btn gray" href="register.html">감독자용 · 현장 QR 만들기</a> <a class="btn gray" href="about.html">서비스 소개</a></p>
    ` + foot;
  }
  render();
})();
</script>
</body>
</html>
