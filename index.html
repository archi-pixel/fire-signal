<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산불신호등 — 불티 작업 전 확인</title>
<meta name="description" content="산림청 산불위험예보와 임상도로 옥외 불티 작업(용접·절단·그라인더·예초기) 전 현장의 산불위험을 확인합니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header><h1>산불신호등 · 불티 작업 전 확인</h1></header>
  <p class="where">불러오는 중…</p>
</main>
<script src="common.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  let fire;
  try { fire = await loadFire(); }
  catch (e) { app.insertAdjacentHTML('beforeend', `<p class="err">${esc(e.message)} — 잠시 뒤 다시 열어 주세요.</p>`); return; }

  const head = '<header><h1>산불신호등 · 불티 작업 전 확인</h1></header>';
  const foot = `<footer>자료: ${esc(fire.source)} · 시군구 안 가장 위험한 곳(최댓값) 기준 · 숲 위치는 산림청 임상도(1:5,000)<br>
    자료 갱신 ${esc(fire.updated)} · 3시간마다 자동 갱신</footer>`;

  // ── 현장 화면 (QR로 들어온 경우) ──
  if (q.get('sg')) {
    const region = fire.regions[q.get('sg')];
    const name = q.get('n') || '현장';
    const fd = q.has('f') && q.get('f') !== '' ? Number(q.get('f')) : null;
    if (!region) { app.innerHTML = head + `<p class="err">이 현장의 지역 자료가 없습니다.</p>` + foot; return; }
    const s = summarize(region);
    const lv = levelOf(s.cur.max);
    const near = fd === null || fd <= NEAR_M;
    const sig = near ? lv : FAR;
    const forestTxt = fd === null ? '확인 안 됨(숲 옆으로 보고 판단)' : fd === 0 ? '숲 안' : `약 ${fd}m`;
    const days = s.days.map(d => `<div class="day"><span class="dl">${d.label}</span><div class="slots">${
      WORK_HOURS.map(h => { const x = d.slots.find(z => z.h === h); if (!x) return `<div class="slot" style="background:#d6d8d3;color:#777">${h}시</div>`;
        const l = levelOf(x.max); return `<div class="slot" style="background:${near ? l.color : '#90a4ae'}">${h}시<small>${l.name}</small></div>`; }).join('')
    }</div></div>`).join('');
    app.innerHTML = head + `
      <div class="site">${esc(name)}</div>
      <div class="where">${esc(region.name)}</div>
      <section class="card">
        <div class="lamp"><div class="dot" style="background:${sig.color}">${near ? lv.name : '숲과<br>먼 곳'}</div>
          <div class="todo">${esc(sig.todo)}</div></div>
        <ul class="facts">
          <li>숲까지 <b>${forestTxt}</b>${near ? '' : ` (${NEAR_M}m 밖)`}</li>
          <li>오늘 지역 산불위험 <b style="color:${lv.color}">${lv.name}</b> · 지수 ${s.cur.max}</li>
        </ul>
      </section>
      <section class="card"><p class="sub">작업 시간대 예보</p><div class="days">${days || '<p>예보 자료가 없습니다.</p>'}</div></section>
      ${s.stale ? `<p class="warn">이 지역은 최근 예보가 갱신되지 않았습니다(마지막 ${esc(dayLabel(s.latest))}). 감독자에게 확인하세요.</p>` : ''}
    ` + foot;
    document.title = `${name} — 산불신호등`;
    return;
  }

  // ── 첫 화면: 두 캠퍼스 ──
  const items = CAMPUSES.map(c => {
    const r = fire.regions[c.sg]; if (!r) return '';
    const s = summarize(r); const lv = levelOf(s.cur.max);
    return `<a href="?sg=${c.sg}&n=${encodeURIComponent(c.n)}"><span>${esc(c.n)}<br><small style="font-weight:400;color:#5d6266;font-size:15px">${esc(r.name)}</small></span>
      <span class="pill" style="background:${lv.color}">${lv.name}</span></a>`;
  }).join('');
  app.innerHTML = head + `
    <section class="card list">${items}</section>
    <p class="where" style="margin-top:14px">현장마다 붙은 QR을 찍으면 그 현장의 숲까지 거리와 할 일이 나옵니다.</p>
    <p><a class="btn gray" href="register.html">감독자용 · 현장 QR 만들기</a></p>
  ` + foot;
})();
</script>
</body>
</html>
