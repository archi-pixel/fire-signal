name: 산불위험예보 자료 갱신

on:
  schedule:
    - cron: "20 */3 * * *"   # 3시간마다 (예보는 3·6·9·12·15·18·21·24시에 나옴)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 산불위험예보 받기
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/fetch_fire.py
      - name: 바뀐 자료 올리기
        run: |
          git config user.name "fire-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fire.json
          git diff --cached --quiet || git commit -m "산불위험예보 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
