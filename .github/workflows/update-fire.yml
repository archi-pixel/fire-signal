name: 산불위험예보 자료 갱신

on:
  schedule:
    # 15분마다. GitHub 예약 실행은 자주 빠지므로 기회를 많이 둠.
    # 자료가 2시간 30분 안이면 산림청 API를 부르지 않고 끝나고(하루 호출 한도 보호),
    # 예보 내용이 그대로면 3시간까지는 저장하지 않으므로 올리는 횟수는 하루 8번 안팎.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 산불위험예보 받기
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          SKIP_IF_NEWER_H: ${{ github.event_name == 'schedule' && '2.5' || '0' }}
        run: python scripts/fetch_fire.py
      - name: 바뀐 자료 올리기
        run: |
          if git diff --quiet -- data/fire.json; then echo "바뀐 자료 없음"; exit 0; fi
          git config user.name "fire-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/fire.json "$RUNNER_TEMP/fire.json"
          # 사무실 PC 예비 갱신과 겹쳐도 되게: 매번 최신 원격 위에 방금 받은 자료를 다시 올림
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/fire.json" data/fire.json
            git add data/fire.json
            if git diff --cached --quiet; then echo "이미 같은 자료가 올라가 있음"; exit 0; fi
            git commit -q -m "산불위험예보 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
