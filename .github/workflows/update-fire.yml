name: 산불위험예보 자료 갱신

on:
  schedule:
    - cron: "20 */3 * * *"   # 3시간마다 (한국시간 0:20, 3:20, … 예보는 3시간 간격으로 나옴)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 산불위험예보 받기
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/fetch_fire.py
      - name: 바뀐 자료 올리기
        run: |
          git config user.name "fire-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fire.json
          if git diff --cached --quiet; then echo "바뀐 자료 없음"; exit 0; fi
          git commit -m "산불위험예보 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
